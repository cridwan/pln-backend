services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile.dev # Development Dockerfile
    container_name: pln_backend
    ports:
      - "3201:8000"
    volumes:
      - ./:/var/www/html # Mount source code ke dalam container
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini # Optional: custom php.ini
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: true
      LOG_CHANNEL: ${LOG_CHANNEL}

    depends_on:
      - mysql
      - minio
    networks:
      - laravel_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
    restart: "no"
